priority_harm: Missing true positive cases in protected groups

primary_metric: recall

tolerance: 0.15

evidence: Logistic Regression achieved overall accuracy of 0.719 and recall of 0.717. The recall difference between groups was approximately 0.138 (G1=0.653, G2=0.791).

limitation: Several intersectional groups have limited sample sizes, including G2 45-59 (n=8), G2 18-29 (n=11), and G2 30-44 (n=14), which may produce unstable estimates.

recommendation: GO_WITH_MONITORING
